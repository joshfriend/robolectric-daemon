name: Publish

on:
  workflow_run:
    workflows: [Test and Check]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, for example v1.0.0
        required: true
        type: string

concurrency:
  group: release

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-snapshot: ${{ steps.version.outputs.is_snapshot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Check version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2 | xargs)
          if [[ -z "$version" ]]; then
            echo "VERSION_NAME is missing" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" != "workflow_run" && ("$version" == *-SNAPSHOT || "$TAG" != "v$version") ]]; then
            echo "Release tag must match the non-snapshot VERSION_NAME" >&2
            exit 1
          fi
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi

  maven-central:
    needs: prepare-release
    if: >
      ${{
        github.repository == 'joshfriend/robolectric-daemon' &&
        (
          (github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            needs.prepare-release.outputs.is-snapshot == 'true') ||
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to Maven Central
        run: |
          : "${ORG_GRADLE_PROJECT_mavenCentralUsername:?Missing MAVEN_CENTRAL_USERNAME}"
          : "${ORG_GRADLE_PROJECT_mavenCentralPassword:?Missing MAVEN_CENTRAL_PASSWORD}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKey:?Missing SIGNING_SECRET_KEY}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKeyId:?Missing SIGNING_SECRET_KEY_ID}"
          ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_SECRET_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_SECRET_KEY_PASSWORD }}

  gradle-plugin-portal:
    needs: [prepare-release, maven-central]
    if: >
      ${{
        github.repository == 'joshfriend/robolectric-daemon' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        needs.prepare-release.outputs.is-snapshot == 'false'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to Gradle Plugin Portal
        run: |
          : "${GRADLE_PUBLISH_KEY:?Missing GRADLE_PUBLISH_KEY}"
          : "${GRADLE_PUBLISH_SECRET:?Missing GRADLE_PUBLISH_SECRET}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKey:?Missing SIGNING_SECRET_KEY}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKeyId:?Missing SIGNING_SECRET_KEY_ID}"
          ./gradlew :plugin:publishPlugins --no-configuration-cache
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_SECRET_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_SECRET_KEY_PASSWORD }}
