import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
  id("java-library")
  id("maven-publish")
  alias(libs.plugins.kotlin.jvm)
  alias(libs.plugins.ktfmt)
  alias(libs.plugins.testkit)
  alias(libs.plugins.protobuf)
  alias(libs.plugins.shadow)
}

group = "com.fueledbycaffeine.robolectricdaemon"
version = providers.gradleProperty("VERSION_NAME").get()

ktfmt { googleStyle() }
kotlin { compilerOptions { jvmTarget = JvmTarget.JVM_11 } }
tasks.withType(JavaCompile).configureEach { options.release = 11 }

configurations {
  protobufRuntime
  compileOnly.extendsFrom(protobufRuntime)
  testImplementation.extendsFrom(protobufRuntime)
}

dependencies {
  implementation("org.jetbrains.kotlin:kotlin-stdlib:${libs.versions.kotlin.get()}")
  protobufRuntime(libs.protobuf)
  testImplementation(platform(libs.junit.bom))
  testImplementation(libs.junit.jupiter)
  testRuntimeOnly(libs.junit.launcher)
}

protobuf {
  protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.get()}" }
  generateProtoTasks {
    all().configureEach {
      builtins { java { option "lite" } }
    }
  }
}

tasks.jar {
  archiveClassifier = "unshaded"
  destinationDirectory = layout.buildDirectory.dir("unshaded")
}
tasks.shadowJar {
  archiveClassifier = ""
  configurations = [project.configurations.protobufRuntime]
  relocate("com.google.protobuf", "com.fueledbycaffeine.robolectricdaemon.internal.protobuf")
}

// Consumers compile against the same relocated types that are published and used at runtime.
["apiElements", "runtimeElements"].each { name ->
  configurations.named(name) {
    outgoing.artifacts.clear()
    outgoing.artifact(tasks.shadowJar)
    outgoing.variants.clear()
  }
}
shadow { addShadowVariantIntoJavaComponent = false }

tasks.test { useJUnitPlatform() }

publishing {
  publications {
    mavenJava(MavenPublication) { from components.java }
  }
}
