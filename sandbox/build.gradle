// Loaded inside the test runtime. Robolectric comes from the project; Vintage and Platform are
// supplied alongside the sandbox so remote execution uses the same JUnit version as discovery.
plugins {
  id("java-library")
  id("maven-publish")
  alias(libs.plugins.testkit)
}

group = "com.fueledbycaffeine.robolectricdaemon"
version = providers.gradleProperty("VERSION_NAME").get()

tasks.withType(JavaCompile).configureEach { options.release = 11 }

dependencies {
  compileOnly(project(":protocol"))
  compileOnly(libs.robolectric) { transitive = false }
  compileOnly(libs.robolectric.sandbox) { transitive = false }
  compileOnly(libs.robolectric.pluginapi) { transitive = false }
  compileOnly(libs.robolectric.shadowapi) { transitive = false }
  compileOnly(libs.asm)
  compileOnly(libs.javax.inject)
  compileOnly(libs.junit4)
  implementation(platform(libs.junit.bom))
  implementation(libs.junit.launcher)
  implementation("org.junit.vintage:junit-vintage-engine")
}

publishing {
  publications {
    mavenJava(MavenPublication) { from components.java }
  }
}
