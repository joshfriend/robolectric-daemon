pluginManagement {
  repositories {
    gradlePluginPortal()
    mavenCentral()
  }
}

dependencyResolutionManagement {
  repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
  repositories {
    google()
    mavenCentral()
  }
}

// Detekt rules are available only when the sibling checkout is present.
if (file("../detekt-gradle-rules").isDirectory()) {
  includeBuild("../detekt-gradle-rules")
} else {
  logger.warn("Detekt Gradle rules checkout not found; Detekt tasks require ../detekt-gradle-rules.")
}

rootProject.name = "robolectric-daemon"

include(":junit-platform-engine")
include(":plugin")
include(":protocol")
include(":sandbox")
include(":worker")
