import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// Protocol bundles a private, relocated protobuf runtime. Worker dependencies, including Kotlin's
// stdlib, stay in the application loader and never enter the test class loader.
plugins {
  id("java-library")
  alias(libs.plugins.maven.publish)
  alias(libs.plugins.kotlin.jvm)
  alias(libs.plugins.ktfmt)
  alias(libs.plugins.testkit)
}

ktfmt { googleStyle() }
kotlin { compilerOptions { jvmTarget = JvmTarget.JVM_11 } }
tasks.withType(JavaCompile).configureEach { options.release = 11 }

group = "com.fueledbycaffeine.robolectricdaemon"

version = providers.gradleProperty("VERSION_NAME").get()

apply from: rootProject.file("gradle/publishing.gradle")

dependencies {
  implementation(project(":protocol"))
  implementation("org.jetbrains.kotlin:kotlin-stdlib:${libs.versions.kotlin.get()}")
  testImplementation(platform(libs.junit.bom))
  testImplementation(libs.junit.jupiter)
  testRuntimeOnly(libs.junit.launcher)
}

tasks.test { useJUnitPlatform() }
